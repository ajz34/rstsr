[package]
name = "rstsr-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CUDA backend for RSTSR"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
rstsr-core = { workspace = true, features = ["std"] }
rstsr-common = { workspace = true, features = ["std"] }
rstsr-dtype-traits = { workspace = true, features = ["half"] }
duplicate = { workspace = true }
num = { workspace = true }
half = { workspace = true }
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-version-from-build-system",
    "fallback-dynamic-loading",
] }

[dev-dependencies]
rstsr = { path = "../../rstsr", default-features = false }

[features]
default = []
# eprintln the planned entry/plan choice per launch (hot-path debug only)
launch_trace = []
# CPU reference device interop (DeviceFaer <-> DeviceCuda conversions).
faer = ["rstsr-core/faer"]
# CUDA version resolution: cudarc detects the toolkit version from the build
# system by default. Without nvcc, set the `CUDARC_CUDA_VERSION` environment
# variable instead of enabling a per-version feature (cudarc cannot compile
# with two version features active, which `--all-features` would do).
# Link against the installed toolkit (requires LD_LIBRARY_PATH or rpath).
# Only the dynamic mode is exposed: cudarc's linking modes are mutually
# exclusive and panic when combined, so forwarding more than one breaks the
# workspace `--all-features` build. The default `fallback-dynamic-loading`
# (set on the dependency) covers the runtime-dlopen case.
dynamic-linking = ["cudarc/dynamic-linking"]

[[bench]]
name = "bench_elementwise"
harness = false
