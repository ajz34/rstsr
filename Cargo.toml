[workspace]
resolver = "2"
members = [
    "rstsr",
    "rstsr-core",
    "rstsr-common",
    "rstsr-dtype-traits",
    "rstsr-blas-traits",
    "rstsr-linalg-traits",
    "rstsr-native-impl",
    "rstsr-sci-traits",
    "crates-device/rstsr-openblas",
    "crates-device/rstsr-mkl",
    "crates-device/rstsr-blis",
    "crates-device/rstsr-aocl",
    "crates-device/rstsr-kml",
    "crates-plugin/rstsr-tblis",
    "crates-interop/rstsr-cpu-dlpack",
    # rstsr-faer-py family, separate due to rustc compile RAM reduction
    "crates-interop/rstsr-faer-py/binding",
    "crates-interop/rstsr-faer-py/core",
    "crates-interop/rstsr-faer-py/create",
    "crates-interop/rstsr-faer-py/index",
    "crates-interop/rstsr-faer-py/linalg",
    "crates-interop/rstsr-faer-py/ops-unary",
    "crates-interop/rstsr-faer-py/ops-binary",
    "crates-interop/rstsr-faer-py/ops-binary-float",
    "crates-interop/rstsr-faer-py/ops-bitwise",
    "crates-interop/rstsr-faer-py/ops-arith",
    "crates-interop/rstsr-faer-py/ops-compare-eq",
    "crates-interop/rstsr-faer-py/ops-compare-ord",
    "crates-interop/rstsr-faer-py/ops-reduce",
]

[workspace.package]
version = "0.10.1"
edition = "2021"
rust-version = "1.82.0"
description = "An n-Dimension Rust Tensor Toolkit"
repository = "https://github.com/RESTGroup/rstsr"
keywords = ["tensor", "array", "blas", "multidimensional", "scientific"]
categories = ["science"]
license = "Apache-2.0"

[workspace.dependencies]
rstsr = { path = "./rstsr", default-features = false, version = "0.10.1" }
rstsr-core = { path = "./rstsr-core", default-features = false, version = "0.10.1" }
# members (without core)
rstsr-common = { path = "./rstsr-common", default-features = false, version = "0.10.1" }
rstsr-dtype-traits = { path = "./rstsr-dtype-traits", default-features = false, version = "0.10.1" }
rstsr-native-impl = { path = "./rstsr-native-impl", default-features = false, version = "0.10.1" }
# members (traits and core-extensions)
rstsr-blas-traits = { path = "./rstsr-blas-traits", default-features = false, version = "0.10.1" }
rstsr-linalg-traits = { path = "./rstsr-linalg-traits", default-features = false, version = "0.10.1" }
rstsr-sci-traits = { path = "./rstsr-sci-traits", default-features = false, version = "0.10.1" }
# members (device)
rstsr-openblas = { path = "./crates-device/rstsr-openblas", default-features = false, version = "0.10.1" }
rstsr-mkl = { path = "./crates-device/rstsr-mkl", default-features = false, version = "0.10.1" }
rstsr-blis = { path = "./crates-device/rstsr-blis", default-features = false, version = "0.10.1" }
rstsr-aocl = { path = "./crates-device/rstsr-aocl", default-features = false, version = "0.10.1" }
rstsr-kml = { path = "./crates-device/rstsr-kml", default-features = false, version = "0.10.1" }
# members (plugin)
rstsr-tblis = { path = "./crates-plugin/rstsr-tblis", default-features = false, version = "0.10.1" }
# members (interop)
rstsr-cpu-dlpack = { path = "./crates-interop/rstsr-cpu-dlpack", default-features = false, version = "0.10.1" }
rstsr-faer-py-core = { path = "./crates-interop/rstsr-faer-py/core", version = "0.10.1" }
rstsr-faer-py-create = { path = "./crates-interop/rstsr-faer-py/create", version = "0.10.1" }
rstsr-faer-py-index = { path = "./crates-interop/rstsr-faer-py/index", version = "0.10.1" }
rstsr-faer-py-linalg = { path = "./crates-interop/rstsr-faer-py/linalg", version = "0.10.1" }
rstsr-faer-py-ops-unary = { path = "./crates-interop/rstsr-faer-py/ops-unary", version = "0.10.1" }
rstsr-faer-py-ops-binary = { path = "./crates-interop/rstsr-faer-py/ops-binary", version = "0.10.1" }
rstsr-faer-py-ops-binary-float = { path = "./crates-interop/rstsr-faer-py/ops-binary-float", version = "0.10.1" }
rstsr-faer-py-ops-bitwise = { path = "./crates-interop/rstsr-faer-py/ops-bitwise", version = "0.10.1" }
rstsr-faer-py-ops-arith = { path = "./crates-interop/rstsr-faer-py/ops-arith", version = "0.10.1" }
rstsr-faer-py-ops-compare-eq = { path = "./crates-interop/rstsr-faer-py/ops-compare-eq", version = "0.10.1" }
rstsr-faer-py-ops-compare-ord = { path = "./crates-interop/rstsr-faer-py/ops-compare-ord", version = "0.10.1" }
rstsr-faer-py-ops-reduce = { path = "./crates-interop/rstsr-faer-py/ops-reduce", version = "0.10.1" }
# develop dependencies that should not publish
rstsr-test-manifest = { path = "./rstsr-test-manifest", default-features = false }
# ffi dependencies
dlpark = { version = "0.9", default-features = false }
rstsr-cblas-base = { version = "0.1" }
rstsr-openblas-ffi = { version = "0.6", default-features = false, features = ["blas", "cblas", "lapack"] }
rstsr-mkl-ffi = { version = "0.3", default-features = false, features = ["blas", "cblas", "lapack"] }
rstsr-blis-ffi = { version = "0.2", default-features = false, features = ["lapack"] }
rstsr-aocl-ffi = { version = "0.3", default-features = false, features = ["blis", "lapack"] }
rstsr-kml-ffi = { version = "0.2", default-features = false, features = ["kblas", "lapack"] }
# basic dependencies
num = { version = "0.4", default-features = false, features = ["alloc", "libm"] }
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
half = { version = "2.7", default-features = false, features = ["alloc", "num-traits"] }
libm = { version = "0.2" }
derive_builder = { version = "0.20", default-features = false, features = ["alloc"] }
duplicate = { version = "2.0" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
# optional dependencies
rayon = { version = ">=1.10" }
faer = { version = "0.24", default-features = false, features = ["rayon", "linalg"] }
faer-ext = { version = "0.8" }
tblis = { version = "0.2" }
opt-einsum-path = { version = "0.2", features = ["par_rand"] }
# dev dependencies
num-bigint = { version = "0.5" }
npyz = { version = "0.9", features = ["complex"] }
rand = { version = "0.10" }
approx = { version = "0.5" }
ndarray = { version = "0.17" }
criterion = { version = "0.8" }
cpu-time = { version = "1.0" }
tblis-src = { version = "0.2" }

[profile.coverage]
inherits = "dev"

[profile.dev-profile]
# Optimized dev level (with debug, boundary checks)
inherits = "dev"
opt-level = 2

[profile.dev.package.rstsr-openblas-ffi]
opt-level = 0
debug = false

[profile.dev.package.rstsr-mkl-ffi]
opt-level = 0
debug = false

[profile.dev.package.rstsr-blis-ffi]
opt-level = 0
debug = false

[profile.dev.package.rstsr-aocl-ffi]
opt-level = 0
debug = false

[profile.dev.package.rstsr-kml-ffi]
opt-level = 0
debug = false

