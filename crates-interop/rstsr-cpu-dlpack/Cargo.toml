[package]
name = "rstsr-cpu-dlpack"
# Versioned independently of the workspace: this crate depends on `dlpark`, whose MSRV (1.88)
# is higher than the workspace's (1.82).
version = "0.10.0-alpha.3"
edition.workspace = true
rust-version = "1.88.0"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "readme.md"
description = "DLPack interchange for rstsr CPU tensors (pure Rust, no Python bindings)"

[dependencies]
dlpark = { workspace = true }
num = { workspace = true }
half = { workspace = true, optional = true }
rstsr-core = { workspace = true }
rstsr-common = { workspace = true }

[features]
default = ["row_major", "std", "half"]
row_major = ["rstsr-core/row_major", "rstsr-common/row_major"]
col_major = ["rstsr-core/col_major", "rstsr-common/col_major"]
std = ["rstsr-core/std", "rstsr-common/std"]
half = ["dep:half", "dlpark/half"]
