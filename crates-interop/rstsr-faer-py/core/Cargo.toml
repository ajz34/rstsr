[package]
name = "rstsr-faer-py-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
publish = false
description = "Shared dtype-erased tensor handle, dtype dispatch and module registration for the rstsr-faer-py Python binding"

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "py-clone"] }
num = { workspace = true }
rstsr = { workspace = true, features = ["default", "linalg", "dlpack"] }
rstsr-core = { workspace = true }
rstsr-dtype-traits = { workspace = true }
rstsr-common = { workspace = true }
# dlpark's Python protocol layer (capsule handshake, `__dlpack_device__`).
dlpark = { workspace = true, features = ["pyo3"] }
