# Tier 1 — rstsr-linalg-traits (faer implementation + SciPy validator scripts).
# Runs on every PR and push to main. Tier assignments: rules/testing.md.
name: tier1-linalg-traits

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  unittests-faer-lianlg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: linalg-traits
    - uses: conda-incubator/setup-miniconda@v2
    - name: conda environment setup
      run: |
        conda init; source $HOME/.bashrc; conda activate
        conda install -y numpy scipy
    - name: manifest initialization
      run: |
        conda init; source $HOME/.bashrc; conda activate
        cd rstsr-test-manifest/resources
        python gen_rand_vec.py
    - name: validate manifest (func_validation_f64)
      run: |
        conda init; source $HOME/.bashrc; conda activate
        python rstsr-blas-traits/src/blas_tests_impl/linalg_func/func_validation_f64.py
    - name: test faer implementation
      run: cargo test -p rstsr-linalg-traits --test "*" --release --features="faer"
