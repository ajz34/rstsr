# Tier 3 — rstsr-cuda.
#
# There is deliberately **no GPU runner** here. This job does two things a GPU cannot help with:
#
#   1. runs the host-side tests (`--lib`), which are where most of this crate's logic lives: the
#      reduction plan, the kernel-token substitution checks, the cuBLAS argument derivation, the
#      index/scan addressing rules. 68 tests, no device required.
#   2. compiles the hardware test suite (`tests/*.rs`) so a change that breaks their *signatures*
#      fails here rather than on the first rented A100.
#
# It does not *run* the hardware suite. Those tests start with `require_cuda!()` and print
# "skipping: no CUDA device visible" when there is no driver, so running them on this runner would
# end green after executing nothing — a worse signal than not running them at all.
name: tier3-cuda

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUSTUP_TOOLCHAIN: stable
  # cudarc resolves the CUDA ABI version at build time. Without this the build stops with an
  # instruction to set it; the value only has to match the toolkit used at *runtime*.
  CUDARC_CUDA_VERSION: "12060"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: host-side unit tests
        run: cargo test -p rstsr-cuda --lib --release
      - name: compile the hardware test suite (not run — no device on this runner)
        run: cargo test -p rstsr-cuda --all-targets --no-run --release
