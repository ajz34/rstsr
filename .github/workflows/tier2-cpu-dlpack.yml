# Tier 2 — rstsr-cpu-dlpack (default + col-major + facade dlpack feature).
# Tier 2 runs on scheduled context and when the `ci:full` label is set;
# on plain PRs it is skipped. Tier assignments: rules/testing.md.
name: tier2-cpu-dlpack

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]

jobs:
  unittests:
    # `ci:full` label: run the whole tier-2 surface on a PR. Job-level `if`
    # keeps the workflow file simple (workflow-level labeled filter + this
    # guard = runs on label add or push to main).
    if: github.event_name == 'push' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unittest (default features)
        run: cargo test -p rstsr-cpu-dlpack --release
      - name: unittest (col-major)
        run: cargo test -p rstsr-cpu-dlpack --release --no-default-features --features "std col_major half"
      - name: facade prelude test (feature dlpack)
        run: cargo test -p rstsr --release --no-default-features --features "std row_major dlpack" --lib
