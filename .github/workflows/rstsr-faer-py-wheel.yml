name: rstsr-faer-py wheel

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Where to upload the built wheel
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One target for the first test; the full platform matrix (macOS,
        # Windows, aarch64) is added next as separate parallel entries.
        include:
          - target: x86_64-unknown-linux-gnu
            manylinux: auto
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Free the pre-installed toolchains this build does not use, so the
          # release build (all crates plus the linked cdylib) has room. The
          # crate split keeps peak build RAM around 6 GB, so no swap is needed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates-interop/rstsr-faer-py/binding
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          # --strip is the only lever that matters for wheel size: it drops the
          # ~410 MB of symbol tables, 51 MB -> 39 MB. Measured (local, jobs=4):
          # opt-level="s" adds nothing (39.10 MB) and thin LTO buys 1 MB for a
          # 10.5 GB link spike. Local grading wheels stay unstripped for
          # backtraces; only the distributed artifact is stripped.
          args: --release --strip --out dist
          rust-toolchain: nightly
          docker-options: -e CARGO_BUILD_JOBS
        env:
          # Four jobs for a shorter build. The dtype-dispatch surface is split
          # across crates, so one rustc peaks at ~4 GB (was 25 GB unsplit) and
          # four measured ~13 GB system-wide on a dev box: near the 16 GB
          # runner's ceiling, so lower this to 2 if the runner swaps. The
          # default release profile is kept — the peak is monomorphization-
          # bound, not profile-bound (opt-level 2 measured the same).
          CARGO_BUILD_JOBS: 4

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: crates-interop/rstsr-faer-py/binding/dist/*.whl

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest # pypa/gh-action-pypi-publish runs on Linux only
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rstsr-faer-py
    permissions:
      id-token: write # OIDC trusted publishing, no stored secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true # forgiving while iterating on one version
